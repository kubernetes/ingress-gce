syntax = "proto3";

package cloud.kubernetes.experiments.proxy;

option go_package = "k8s.io/ingress-gce/pkg/experiments/pb/epb";

service Experiments {
  // BoolFlagValueOrFailsafe returns the value of a boolean flag or the failsafe
  // value if the flag is not found.
  rpc BoolFlagValueOrFailsafe(BoolFlagValueOrFailsafeRequest)
      returns (BoolFlagValueOrFailsafeResponse) {
  }

  // StringFlagValueOrFailsafe returns the value of a string flag or the
  // failsafe value if the flag is not found.
  rpc StringFlagValueOrFailsafe(StringFlagValueOrFailsafeRequest)
      returns (StringFlagValueOrFailsafeResponse) {
  }

  // Int64FlagValueOrFailsafe returns the value of an int64 flag or the
  // failsafe value if the flag is not found.
  rpc Int64FlagValueOrFailsafe(Int64FlagValueOrFailsafeRequest)
      returns (Int64FlagValueOrFailsafeResponse) {
  }

  // DoubleFlagValueOrFailsafe returns the value of a double flag or the
  // failsafe value if the flag is not found.
  rpc DoubleFlagValueOrFailsafe(DoubleFlagValueOrFailsafeRequest)
      returns (DoubleFlagValueOrFailsafeResponse) {
  }
}

message BoolFlagValueOrFailsafeRequest {
  string flag_name = 1;
  bool failsafe_value = 2;
}

message BoolFlagValueOrFailsafeResponse {
  bool value = 1;
}

message StringFlagValueOrFailsafeRequest {
  string flag_name = 1;
  string failsafe_value = 2;
}

message StringFlagValueOrFailsafeResponse {
  string value = 1;
}

message Int64FlagValueOrFailsafeRequest {
  string flag_name = 1;
  int64 failsafe_value = 2;
}

message Int64FlagValueOrFailsafeResponse {
  int64 value = 1;
}

message DoubleFlagValueOrFailsafeRequest {
  string flag_name = 1;
  double failsafe_value = 2;
}

message DoubleFlagValueOrFailsafeResponse {
  double value = 1;
}
