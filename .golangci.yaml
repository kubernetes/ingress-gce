version: "2"
linters:
  default: none
  enable:
    - errcheck
    - forbidigo
    - unused
  settings:
    errcheck:
      exclude-functions:
        - (*flag.FlagSet).Parse
    forbidigo:
      forbid:
        - pattern: ^v1.Pod.Annotations$
          pkg: ^k8s\.io/api/core/v1$
        - pattern: ^v1.Pod.OwnerReferences$
          pkg: ^k8s\.io/api/core/v1$
        - pattern: ^v1.Pod.Finalizers$
          pkg: ^k8s\.io/api/core/v1$
        - pattern: ^v1.Pod.ManagedFields$
          pkg: ^k8s\.io/api/core/v1$
        - pattern: ^v1.PodSpec.Volumes$
          pkg: ^k8s\.io/api/core/v1$
        - pattern: ^v1.PodSpec.InitContainers$
          pkg: ^k8s\.io/api/core/v1$
        - pattern: ^v1.PodSpec.EphemeralContainers$
          pkg: ^k8s\.io/api/core/v1$
        - pattern: ^v1.PodSpec.ImagePullSecrets$
          pkg: ^k8s\.io/api/core/v1$
        - pattern: ^v1.PodSpec.HostAliases$
          pkg: ^k8s\.io/api/core/v1$
        - pattern: ^v1.PodSpec.SchedulingGates$
          pkg: ^k8s\.io/api/core/v1$
        - pattern: ^v1.PodSpec.ResourceClaims$
          pkg: ^k8s\.io/api/core/v1$
        - pattern: ^v1.PodSpec.Tolerations$
          pkg: ^k8s\.io/api/core/v1$
        - pattern: ^v1.PodSpec.Affinity$
          pkg: ^k8s\.io/api/core/v1$
        - pattern: ^v1.PodStatus.InitContainerStatuses$
          pkg: ^k8s\.io/api/core/v1$
        - pattern: ^v1.PodStatus.ContainerStatuses$
          pkg: ^k8s\.io/api/core/v1$
        - pattern: ^v1.PodStatus.EphemeralContainerStatuses$
          pkg: ^k8s\.io/api/core/v1$
        - pattern: ^v1.Container.Image$
          pkg: ^k8s\.io/api/core/v1$
        - pattern: ^v1.Container.Command$
          pkg: ^k8s\.io/api/core/v1$
        - pattern: ^v1.Container.Args$
          pkg: ^k8s\.io/api/core/v1$
        - pattern: ^v1.Container.EnvFrom$
          pkg: ^k8s\.io/api/core/v1$
        - pattern: ^v1.Container.Env$
          pkg: ^k8s\.io/api/core/v1$
        - pattern: ^v1.Container.Resources$
          pkg: ^k8s\.io/api/core/v1$
        - pattern: ^v1.Container.VolumeMounts$
          pkg: ^k8s\.io/api/core/v1$
        - pattern: ^v1.Container.VolumeDevices$
          pkg: ^k8s\.io/api/core/v1$
        - pattern: ^v1.Container.SecurityContext$
          pkg: ^k8s\.io/api/core/v1$
        - pattern: ^v1.NodeStatus.Images$
          pkg: ^k8s\.io/api/core/v1$
      analyze-types: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - forbidigo
        path: _test\.go
      - linters:
          - errcheck
        text: AddEventHandler
      - linters:
          - forbidigo
        path: pkg/context/context.go$
      - linters:
          - forbidigo
        path: pkg/e2e/fixtures.go$
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
